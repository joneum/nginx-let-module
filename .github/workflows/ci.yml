name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module
    # shows up here and not in somebody's build
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: nginx ${{ matrix.nginx }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 1.22.0 is the oldest release the README promises, 1.30.5 the
        # current stable and 1.31.6 the current mainline
        nginx: ['1.22.0', '1.24.0', '1.26.3', '1.28.0', '1.30.5', '1.31.6']

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpcre2-dev zlib1g-dev libssl-dev cpanminus

      - name: Cache Test::Nginx
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: cpan-${{ runner.os }}-test-nginx

      - name: Install Test::Nginx
        run: |
          cpanm --local-lib=~/perl5 --notest --quiet Test::Nginx
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Build nginx ${{ matrix.nginx }}
        run: ci/build.sh '${{ matrix.nginx }}' "$HOME/nginx"

      - name: Run the test suite
        run: TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  dynamic:
    name: loadable module
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpcre2-dev zlib1g-dev libssl-dev cpanminus

      - name: Cache Test::Nginx
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: cpan-${{ runner.os }}-test-nginx

      - name: Install Test::Nginx
        run: |
          cpanm --local-lib=~/perl5 --notest --quiet Test::Nginx
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Build every module as a loadable object
        run: ci/build.sh 1.31.6 "$HOME/nginx" dynamic

      - name: Run the test suite against the loaded modules
        run: |
          mods=
          for so in "$HOME"/nginx/modules/*.so; do
            mods="$mods $so"
          done
          echo "loading:$mods"
          TEST_NGINX_LOAD_MODULES="$mods" \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  grammar:
    name: let.y still compiles
    runs-on: ubuntu-latest
    # src/let.tab.c is bison output that is committed to the tree, and
    # it was generated a long time ago; a current bison lays out the
    # tables differently, so comparing the two files says nothing.  What
    # is worth knowing is whether the grammar itself is still valid.

    steps:
      - uses: actions/checkout@v7

      - name: Install bison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison

      - name: Run bison over the grammar
        run: |
          cd src
          bison -Wall -d -o /tmp/let.tab.c let.y
          echo "the grammar compiles"

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    # every other job measures Linux, and the port this module is
    # packaged in is a FreeBSD one

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the suite in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '14'
          prepare: |
            pkg install -y git pcre2 p5-Test-Nginx
          run: |
            ci/build.sh 1.31.6 "$HOME/nginx"
            # the job runs as root, and Test::Nginx then writes "user
            # root;" into its configuration.  root has no group of that
            # name here, it is in wheel
            TEST_NGINX_WORKER_USER='root wheel' \
              TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    # slow, and a pull request is already covered by the matrix above
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpcre2-dev zlib1g-dev libssl-dev cpanminus valgrind

      - name: Cache Test::Nginx
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: cpan-${{ runner.os }}-test-nginx

      - name: Install Test::Nginx
        run: |
          cpanm --local-lib=~/perl5 --notest --quiet Test::Nginx
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Build nginx
        run: ci/build.sh 1.31.6 "$HOME/nginx"

      - name: Run the test suite under valgrind
        run: |
          set -o pipefail
          TEST_NGINX_USE_VALGRIND=1 TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" \
            prove -r t/ 2>&1 | tee valgrind.log

      - name: No findings allowed
        run: |
          if grep -niE "invalid read|invalid write|definitely lost|indirectly lost|uninitialised|uninitialized value|conditional jump|mismatched free" valgrind.log; then
            echo "valgrind reported the lines above" >&2
            exit 1
          fi
          echo "valgrind found nothing"
